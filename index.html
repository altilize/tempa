<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tempa</title>
  <meta name="description" content="Pelacak berat badan, kalori, dan uang makan dengan coach AI.">
  <meta name="theme-color" content="#0d0f0c">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">TEMPA</div>
    <div id="hdr-stats" class="hdr-stats"></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Navigasi">
    <button data-tab="home" data-icon="home"><span>Beranda</span></button>
    <button data-tab="log" data-icon="log"><span>Riwayat</span></button>
    <button class="fab" data-icon="plus" aria-label="Tambah makanan"></button>
    <button data-tab="coach" data-icon="coach"><span>Coach</span></button>
    <button data-tab="progress" data-icon="chart"><span>Progres</span></button>
  </nav>

  <div id="sheet-root" class="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" class="confetti" hidden></canvas>

  <script type="module" src="js/app.js"></script>
</body>
</html>
